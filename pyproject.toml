[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meridian-x"
version = "0.3.0"
description = "소중한 미디어 컬렉션을 완벽하게 관리하는 품격 있는 자동화 큐레이션 솔루션."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "python-dotenv",
    "transmission-rpc>=7.0.11,<8",
    "playwright>=1.40",
    "beautifulsoup4>=4.15.0",
    "typer>=0.9.0",
    "httpx>=0.24.0",
    "aria2p>=0.11.0",
    "rich>=13.0.0",
    "pyperclip>=1.8.2",
]

[project.scripts]
meridian = "meridian_x.cli:main"
url-resolver = "url_resolver.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_x", "src/url_resolver"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=0.23.0",
]
